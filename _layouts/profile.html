---
layout: compress
---
{% include base_path %}
<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}">
  <head>
    <link rel="preload" as="image" type="image/webp" href="{{ base_path }}/images/{{ site.author.avatar }}" fetchpriority="high">
    {% include head.html %}
    {% include head/custom.html %}
  </head>
  <body class="profile-site">
    <div class="garden-frame">
      <header class="profile-header">
        <a class="profile-wordmark" href="{{ base_path }}/" aria-label="Tanush Swaminathan — home">{{ site.title | downcase }}</a>
      </header>
      <main class="profile-page" aria-label="About Tanush Swaminathan">
        <div class="profile-intro">
          <img class="profile-photo" src="{{ base_path }}/images/{{ site.author.avatar }}" alt="Tanush Swaminathan" width="849" height="1100" loading="eager" fetchpriority="high">
          <div>{{ page.intro | markdownify }}</div>
        </div>
        <div class="profile-copy">
          {{ content }}
          {% include profile-links.html %}
        </div>
      </main>
    </div>
    <span id="home-ping" hidden aria-live="off"></span>
    <script src="{{ base_path }}/assets/js/ping.js" defer></script>
    {% include analytics.html %}
  </body>
</html>
